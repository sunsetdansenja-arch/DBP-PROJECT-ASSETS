<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DBP | System Access</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090B; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        /* Brutalism Styles */
        .brutal-border { border: 4px solid #3F3F46; }
        .brutal-border-active { border: 4px solid #EA580C; }
        .brutal-shadow { box-shadow: 6px 6px 0px 0px #EA580C; }
        .brutal-shadow-zinc { box-shadow: 6px 6px 0px 0px #3F3F46; }
        .hover-brutal:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px 0px #EA580C; }
        .active-brutal:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #EA580C; }
        .numpad-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #EA580C; }

        /* Scrollbar Apple Style */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181B; }
        ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #EA580C; }

        /* Animations */
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .animate-shake { animation: shake 0.4s; }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-fast { animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-zinc-100">

    <div id="view-login" class="h-full w-full flex flex-col items-center justify-center px-6 absolute inset-0 z-40 bg-zinc-950 transition-all duration-700">
        <div class="w-full max-w-sm flex flex-col items-center animate-slide-up">
            <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="h-12 w-auto mb-8 bg-zinc-800 p-2 rounded-xl brutal-border" alt="Logo DBP">
            <h1 class="font-black text-3xl tracking-tighter uppercase mb-2">System Access</h1>
            <p class="text-xs font-black text-zinc-500 uppercase tracking-widest mb-10">Restricted Area</p>

            <div class="w-full bg-zinc-900 brutal-border rounded-3xl p-6 mb-8 text-center brutal-shadow">
                <input type="text" id="userInput" placeholder="MASUKKAN STAFF ID" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
                    class="w-full bg-zinc-800 text-white font-black uppercase text-lg px-4 py-4 rounded-xl outline-none text-center mb-6 brutal-border focus:brutal-border-active transition-all placeholder-zinc-500">

                <p class="text-[10px] font-black text-zinc-500 mb-3 uppercase tracking-widest">Masukkan PIN Anda</p>
                <div id="pin-dots" class="flex justify-center gap-4">
                    <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-1"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-2"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-3"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-4"></div>
                </div>
                <p id="error-msg" class="text-red-500 font-black text-[10px] uppercase tracking-widest mt-4 opacity-0 transition-opacity">Akses Ditolak</p>
            </div>

            <div class="grid grid-cols-3 gap-4 w-full px-4">
                <script>
                    for(let i=1; i<=9; i++) document.write(`<button onclick="LOGIN_SYSTEM.press('${i}')" class="numpad-btn bg-zinc-800 brutal-border rounded-2xl h-16 text-2xl font-black transition-all">${i}</button>`);
                </script>
                <button onclick="LOGIN_SYSTEM.press('clear')" class="numpad-btn bg-zinc-800 brutal-border rounded-2xl h-16 text-xs font-black uppercase text-zinc-500 tracking-widest transition-all">Del</button>
                <button onclick="LOGIN_SYSTEM.press('0')" class="numpad-btn bg-zinc-800 brutal-border rounded-2xl h-16 text-2xl font-black transition-all">0</button>
                <button disabled class="bg-transparent h-16"></button>
            </div>
        </div>
    </div>

    <div id="view-cashier" class="h-full w-full hidden flex-col absolute inset-0 z-30 bg-zinc-900">
        <header class="bg-zinc-950 border-b-4 border-zinc-800 p-4 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-4">
                <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="h-8 bg-zinc-800 p-1 rounded-md brutal-border">
                <div>
                    <h1 class="font-black tracking-tighter text-xl uppercase leading-none">Command Desk</h1>
                    <p id="cashier-branch-name" class="text-[10px] font-black text-orange-500 uppercase tracking-widest">LOADING...</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="CASHIER_LOGIC.loadData()" class="bg-zinc-800 text-white font-black text-xs px-4 py-2 rounded-xl brutal-border active-brutal transition-all uppercase tracking-widest flex items-center gap-2">
                    <span id="sync-icon">🔄</span> SYNC DATA
                </button>
                <button onclick="LOGIN_SYSTEM.logout()" class="bg-red-600 text-white font-black text-xs px-4 py-2 rounded-xl brutal-border active-brutal transition-all uppercase tracking-widest">
                    LOGOUT
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-hidden flex flex-col lg:flex-row p-4 gap-4">
            
            <section class="flex-1 bg-zinc-950 brutal-border rounded-3xl flex flex-col overflow-hidden">
                <div class="p-4 border-b-4 border-zinc-800 flex justify-between items-end bg-zinc-900">
                    <div>
                        <h2 class="font-black text-2xl tracking-tighter uppercase">Live Queue</h2>
                        <p class="text-xs font-black text-zinc-500 uppercase tracking-widest">Antrean Eksekusi Hari Ini</p>
                    </div>
                    <div class="bg-orange-600 px-3 py-1 rounded-lg text-xs font-black brutal-border">
                        <span id="queue-count">0</span> WAITING
                    </div>
                </div>
                <div id="queue-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <div id="queue-loading" class="w-full bg-zinc-900 brutal-border rounded-2xl p-6 animate-pulse-fast flex justify-between items-center">
                        <div class="space-y-3 w-1/2">
                            <div class="h-6 bg-zinc-800 rounded w-3/4"></div>
                            <div class="h-4 bg-zinc-800 rounded w-1/2"></div>
                        </div>
                        <div class="h-10 bg-zinc-800 rounded w-1/4"></div>
                    </div>
                    </div>
            </section>

            <section class="w-full lg:w-96 flex flex-col gap-4">
                
                <button onclick="CASHIER_LOGIC.openExpenseModal()" class="w-full bg-orange-600 text-zinc-950 font-black text-lg py-5 rounded-3xl brutal-border brutal-shadow hover-brutal transition-all uppercase tracking-widest flex justify-center items-center gap-2 shrink-0">
                    <span>[-] CATAT PENGELUARAN</span>
                </button>

                <div class="flex-1 bg-zinc-950 brutal-border rounded-3xl flex flex-col overflow-hidden">
                    <div class="p-4 border-b-4 border-zinc-800 bg-zinc-900">
                        <h2 class="font-black text-xl tracking-tighter uppercase">Petty Cash</h2>
                        <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Log Pengeluaran Hari Ini</p>
                    </div>
                    <div id="expense-container" class="flex-1 overflow-y-auto p-4 space-y-3">
                        <div id="expense-loading" class="w-full bg-zinc-900 brutal-border rounded-xl p-4 animate-pulse-fast h-16"></div>
                        </div>
                    <div class="p-4 border-t-4 border-zinc-800 bg-zinc-900 flex justify-between items-center">
                        <span class="text-xs font-black text-zinc-500 uppercase tracking-widest">Total Keluar:</span>
                        <span id="expense-total" class="font-black text-xl text-orange-500">Rp 0</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-expense" class="fixed inset-0 z-50 bg-zinc-950/80 backdrop-blur-sm hidden flex-col items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-sm rounded-[32px] p-6 sm:p-8 brutal-border brutal-shadow animate-slide-up">
            <h2 class="font-black text-2xl mb-1 tracking-tighter uppercase text-white border-b-4 border-zinc-700 pb-2">Input Pengeluaran</h2>
            
            <div class="space-y-4 mt-6">
                <div>
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-widest">Kategori</label>
                    <select id="exp-kategori" class="w-full bg-zinc-800 text-white font-black uppercase text-sm px-4 py-3 rounded-xl outline-none border-2 border-zinc-700 mt-1">
                        <option value="OPERASIONAL">Operasional</option>
                        <option value="KONSUMSI">Konsumsi</option>
                        <option value="MAINTENANCE">Maintenance</option>
                        <option value="LAINNYA">Lainnya</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-widest">Deskripsi Item</label>
                    <input type="text" id="exp-deskripsi" placeholder="Contoh: Beli Silet / Galon" class="w-full bg-zinc-800 text-white font-black uppercase text-sm px-4 py-3 rounded-xl outline-none border-2 border-zinc-700 mt-1 placeholder-zinc-600">
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-widest">Nominal (Rp)</label>
                    <input type="number" id="exp-nominal" placeholder="0" class="w-full bg-zinc-800 text-orange-500 font-black uppercase text-xl px-4 py-3 rounded-xl outline-none border-2 border-zinc-700 mt-1 placeholder-zinc-600">
                </div>
                
                <div class="flex gap-2 pt-4">
                    <button onclick="CASHIER_LOGIC.closeExpenseModal()" class="w-1/3 bg-zinc-700 text-white py-4 rounded-[16px] font-black uppercase tracking-widest brutal-border active-brutal transition-all">Batal</button>
                    <button id="btn-submit-exp" onclick="CASHIER_LOGIC.submitExpense()" class="w-2/3 bg-orange-600 text-white py-4 rounded-[16px] font-black uppercase tracking-widest brutal-border brutal-shadow-sm active-brutal transition-all">SIMPAN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="fixed inset-0 bg-zinc-950/90 hidden flex-col items-center justify-center z-[100]">
        <div class="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h2 id="loading-text" class="font-black text-orange-600 tracking-widest uppercase text-sm">Memproses...</h2>
    </div>

    <script>
        const CONFIG = {
            WEBHOOK_URL: 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/a6512d05-a51a-4289-9063-9a4f17ac745a' 
        };

        const STATE = {
            user: null
        };

        // --- 1. LOGIN & ROUTING SYSTEM ---
        const LOGIN_SYSTEM = {
            pin: "",
            
            init() {
                // Cek apakah ada session aktif
                const savedUser = localStorage.getItem('dbp_user');
                if (savedUser) {
                    STATE.user = JSON.parse(savedUser);
                    this.routeUser();
                }
                
                document.getElementById('userInput').addEventListener('input', function(e) {
                    this.value = this.value.toUpperCase();
                });
            },

            routeUser() {
                if (!STATE.user) return;
                
                const role = STATE.user.role;
                document.getElementById('view-login').style.transform = 'translateY(-100%)';
                
                setTimeout(() => {
                    document.getElementById('view-login').classList.add('hidden');
                    if (role === 'CASHIER') {
                        document.getElementById('view-cashier').classList.remove('hidden');
                        document.getElementById('view-cashier').classList.add('flex');
                        CASHIER_LOGIC.init();
                    } else {
                        alert(`DASHBOARD ${role} SEDANG DIBANGUN OLEH DEVELOPER.\nSilakan Logout.`);
                        document.getElementById('view-login').style.transform = 'translateY(0)';
                        document.getElementById('view-login').classList.remove('hidden');
                    }
                }, 700);
            },

            press(val) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.style.opacity = '0';
                
                if (val === 'clear') { this.pin = this.pin.slice(0, -1); } 
                else { if (this.pin.length < 4) this.pin += val; }
                
                this.updateDots();
                if (this.pin.length === 4) setTimeout(() => this.submit(), 200);
            },

            updateDots() {
                for (let i = 1; i <= 4; i++) {
                    const dot = document.getElementById(`dot-${i}`);
                    if (i <= this.pin.length) {
                        dot.classList.add('bg-orange-500', 'border-orange-500');
                        dot.classList.remove('border-zinc-500', 'bg-transparent');
                    } else {
                        dot.classList.remove('bg-orange-500', 'border-orange-500');
                        dot.classList.add('border-zinc-500', 'bg-transparent');
                    }
                }
            },

            async submit() {
                const username = document.getElementById('userInput').value.trim().toUpperCase(); 
                const errorMsg = document.getElementById('error-msg');

                if (!username) {
                    errorMsg.innerText = "ISI STAFF ID DULU BOS";
                    errorMsg.style.opacity = '1';
                    this.triggerError();
                    return;
                }

                document.getElementById('loading-overlay').classList.remove('hidden');
                document.getElementById('loading-overlay').classList.add('flex');

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'login', username: username, password: this.pin })
                    });
                    
                    const data = await res.json();
                    const isSuccess = data.success || (Array.isArray(data) && data[0] && data[0].success);
                    
                    if (isSuccess) {
                        STATE.user = data.user || data[0].user;
                        localStorage.setItem('dbp_user', JSON.stringify(STATE.user));
                        this.routeUser();
                    } else {
                        throw new Error("Invalid Auth");
                    }
                } catch (e) {
                    this.triggerError();
                } finally {
                    document.getElementById('loading-overlay').classList.add('hidden');
                    document.getElementById('loading-overlay').classList.remove('flex');
                    document.getElementById('userInput').value = "";
                    this.pin = "";
                    this.updateDots();
                }
            },

            triggerError() {
                this.pin = "";
                this.updateDots();
                const container = document.getElementById('pin-dots').parentElement;
                container.classList.add('animate-shake');
                document.getElementById('error-msg').innerText = "AKSES DITOLAK";
                document.getElementById('error-msg').style.opacity = '1';
                setTimeout(() => container.classList.remove('animate-shake'), 400);
            },

            logout() {
                localStorage.removeItem('dbp_user');
                STATE.user = null;
                location.reload(); // Hard reset UI
            }
        };

        // --- 2. CASHIER LOGIC ---
        const CASHIER_LOGIC = {
            init() {
                document.getElementById('cashier-branch-name').innerText = STATE.user.branch;
                this.loadData();
            },

            async loadData() {
                const syncIcon = document.getElementById('sync-icon');
                syncIcon.classList.add('animate-spin');
                
                document.getElementById('queue-loading').style.display = 'flex';
                document.getElementById('expense-loading').style.display = 'block';

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'get_cashier_data', branch: STATE.user.branch })
                    });
                    
                    const rawData = await res.json();
                    const payload = Array.isArray(rawData) ? rawData[0] : rawData;

                    if (payload.success) {
                        this.renderQueue(payload.queue || []);
                        this.renderExpenses(payload.expenses || []);
                    }
                } catch (e) {
                    alert("Gagal sinkronisasi data dengan server.");
                } finally {
                    syncIcon.classList.remove('animate-spin');
                    document.getElementById('queue-loading').style.display = 'none';
                    document.getElementById('expense-loading').style.display = 'none';
                }
            },

            renderQueue(data) {
                const container = document.getElementById('queue-container');
                // Hapus semua isi kecuali SKELETON (biar bisa dipake lagi)
                Array.from(container.children).forEach(c => {
                    if(c.id !== 'queue-loading') c.remove();
                });

                // Tampilkan yang belum DONE saja (PENDING / ON DUTY)
                const activeQueue = data.filter(d => d.status !== 'DONE').sort((a,b) => a.jam.localeCompare(b.jam));
                document.getElementById('queue-count').innerText = activeQueue.length;

                if (activeQueue.length === 0) {
                    container.insertAdjacentHTML('beforeend', `<div class="text-center py-10 text-zinc-600 font-black uppercase tracking-widest text-xs">Kosong. Waktunya ngopi ☕</div>`);
                    return;
                }

                activeQueue.forEach(item => {
                    const isPending = item.status === 'PENDING';
                    const statusColor = isPending ? 'bg-zinc-700 text-zinc-300' : 'bg-orange-600 text-white';
                    const btnAction = isPending 
                        ? `<button onclick="CASHIER_LOGIC.updateStatus('${item.id}', 'ON DUTY')" class="w-full sm:w-auto bg-zinc-800 text-white border-2 border-zinc-600 px-6 py-4 rounded-xl font-black uppercase text-xs active-brutal transition-all mt-3 sm:mt-0">Mulai (ON DUTY)</button>`
                        : `<button onclick="CASHIER_LOGIC.updateStatus('${item.id}', 'DONE')" class="w-full sm:w-auto bg-orange-500 text-zinc-950 px-6 py-4 rounded-xl brutal-border brutal-shadow-sm active-brutal transition-all mt-3 sm:mt-0 font-black uppercase text-xs hover-brutal">Selesaikan (DONE)</button>`;

                    const html = `
                    <div class="bg-zinc-900 brutal-border rounded-2xl p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center">
                        <div>
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-lg font-black text-white">${item.jam}</span>
                                <span class="text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-md ${statusColor}">${item.status}</span>
                            </div>
                            <h3 class="font-black text-xl text-white uppercase tracking-tighter leading-none mb-1">${item.cust_name || 'GUEST'}</h3>
                            <p class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Capster: <span class="text-orange-500">${item.capster_id || '-'}</span> | Rp ${(item.price || 0).toLocaleString('id-ID')}</p>
                        </div>
                        ${btnAction}
                    </div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });
            },

            renderExpenses(data) {
                const container = document.getElementById('expense-container');
                Array.from(container.children).forEach(c => {
                    if(c.id !== 'expense-loading') c.remove();
                });

                let total = 0;
                if (data.length === 0) {
                    container.insertAdjacentHTML('beforeend', `<div class="text-center py-4 text-zinc-600 font-black uppercase tracking-widest text-[10px]">Belum ada pengeluaran</div>`);
                } else {
                    data.forEach(item => {
                        const nom = Number(item.nominal) || 0;
                        total += nom;
                        const html = `
                        <div class="bg-zinc-900 border-2 border-zinc-800 rounded-xl p-3 flex justify-between items-center">
                            <div>
                                <p class="font-black text-white text-xs uppercase">${item.deskripsi || '-'}</p>
                                <p class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest">${item.kategori || '-'}</p>
                            </div>
                            <span class="font-black text-orange-500 text-sm">- Rp ${nom.toLocaleString('id-ID')}</span>
                        </div>`;
                        container.insertAdjacentHTML('beforeend', html);
                    });
                }
                
                document.getElementById('expense-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            },

            async updateStatus(id, newStatus) {
                if(!confirm(`Yakin ubah status jadi ${newStatus}?`)) return;

                const overlay = document.getElementById('loading-overlay');
                const textLoading = document.getElementById('loading-text');
                textLoading.innerText = "MENGUPDATE STATUS...";
                overlay.classList.remove('hidden'); overlay.classList.add('flex');

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'update_status', id: id, status: newStatus })
                    });
                    
                    if(res.ok) {
                        await this.loadData(); // Sync otomatis setelah update
                    } else { throw new Error("Gagal Update"); }
                } catch (e) {
                    alert("Terjadi kesalahan jaringan.");
                } finally {
                    overlay.classList.add('hidden'); overlay.classList.remove('flex');
                }
            },

            openExpenseModal() {
                document.getElementById('exp-deskripsi').value = '';
                document.getElementById('exp-nominal').value = '';
                document.getElementById('modal-expense').classList.remove('hidden');
                document.getElementById('modal-expense').classList.add('flex');
            },

            closeExpenseModal() {
                document.getElementById('modal-expense').classList.add('hidden');
                document.getElementById('modal-expense').classList.remove('flex');
            },

            async submitExpense() {
                const tgl = new Date().toISOString().split('T')[0];
                const kat = document.getElementById('exp-kategori').value;
                const desc = document.getElementById('exp-deskripsi').value.trim();
                const nom = document.getElementById('exp-nominal').value;

                if(!desc || !nom) return alert("Isi deskripsi dan nominal dulu!");

                const btn = document.getElementById('btn-submit-exp');
                btn.innerText = "LOADING..."; btn.disabled = true;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ 
                            action: 'add_expense', 
                            tanggal: tgl,
                            branch: STATE.user.branch,
                            cashier_id: STATE.user.staff_id,
                            kategori: kat,
                            deskripsi: desc,
                            nominal: nom
                        })
                    });
                    
                    if(res.ok) {
                        this.closeExpenseModal();
                        await this.loadData(); // Sync tabel pengeluaran
                    } else { throw new Error("Gagal Input"); }
                } catch (e) {
                    alert("Gagal mencatat pengeluaran.");
                } finally {
                    btn.innerText = "SIMPAN"; btn.disabled = false;
                }
            }
        };

        // Mulai sistem
        window.onload = () => LOGIN_SYSTEM.init();
    </script>
</body>
</html>
