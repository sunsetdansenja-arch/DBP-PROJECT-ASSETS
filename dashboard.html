<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DBP | System Access</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090B; color: white; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        
        /* Brutalism Styles */
        .brutal-border { border: 4px solid #3F3F46; }
        .brutal-border-active { border: 4px solid #EA580C; }
        .brutal-shadow { box-shadow: 6px 6px 0px 0px #EA580C; }
        .numpad-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #EA580C; }

        /* Animations */
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .animate-shake { animation: shake 0.4s; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center px-6">

    <div class="w-full max-w-sm flex flex-col items-center animate-slide-up">
        
        <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="h-12 w-auto mb-8 bg-zinc-800 p-2 rounded-xl brutal-border" alt="Logo DBP">
        <h1 class="font-black text-3xl tracking-tighter uppercase mb-2">System Access</h1>
        <p class="text-xs font-black text-zinc-500 uppercase tracking-widest mb-10">Restricted Area</p>

        <div class="w-full bg-zinc-900 brutal-border rounded-3xl p-6 mb-8 text-center brutal-shadow">
            
            <select id="userSelect" class="w-full bg-zinc-800 text-white font-black uppercase text-sm px-4 py-3 rounded-xl outline-none appearance-none text-center mb-6 brutal-border focus:brutal-border-active transition-all cursor-pointer">
                <option value="" disabled selected>-- Pilih ID Akses --</option>
                <option value="DONOVAN">DONOVAN (Capster)</option>
                <option value="HAYEED">HAYEED (Capster)</option>
                <option value="SULLY">SULLY (Capster)</option>
                <option value="MAX">MAX (Capster)</option>
                <option value="SUMMER">SUMMER (Cashier)</option>
                <option value="USMAN">USMAN (Branch Owner)</option>
                <option value="PRIASOLO">PRIA SOLO (Management)</option>
            </select>

            <div id="pin-dots" class="flex justify-center gap-4">
                <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-1"></div>
                <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-2"></div>
                <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-3"></div>
                <div class="w-4 h-4 rounded-full border-2 border-zinc-500 transition-all" id="dot-4"></div>
            </div>
            <p id="error-msg" class="text-red-500 font-black text-[10px] uppercase tracking-widest mt-4 opacity-0 transition-opacity">Akses Ditolak</p>
        </div>

        <div class="grid grid-cols-3 gap-4 w-full px-4">
            <script>
                for(let i=1; i<=9; i++) {
                    document.write(`<button onclick="LOGIN_SYSTEM.press('${i}')" class="numpad-btn bg-zinc-800 brutal-border rounded-2xl h-16 text-2xl font-black transition-all">${i}</button>`);
                }
            </script>
            <button onclick="LOGIN_SYSTEM.press('clear')" class="numpad-btn bg-zinc-800 brutal-border rounded-2xl h-16 text-xs font-black uppercase text-zinc-500 tracking-widest transition-all">Del</button>
            <button onclick="LOGIN_SYSTEM.press('0')" class="numpad-btn bg-zinc-800 brutal-border rounded-2xl h-16 text-2xl font-black transition-all">0</button>
            <button disabled class="bg-transparent h-16"></button> </div>

    </div>

    <div id="loading-overlay" class="fixed inset-0 bg-zinc-950/90 hidden flex-col items-center justify-center z-50">
        <div class="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h2 class="font-black text-orange-600 tracking-widest uppercase text-sm">Verifikasi Akses...</h2>
    </div>

    <script>
        // GANTI INI DENGAN URL WEBHOOK N8N PINTU 2 LO!
        const CONFIG = {
            WEBHOOK_URL: 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/dbp-private' 
        };

        const LOGIN_SYSTEM = {
            pin: "",
            
            press(val) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.style.opacity = '0';
                
                if (val === 'clear') {
                    this.pin = this.pin.slice(0, -1);
                } else {
                    if (this.pin.length < 4) this.pin += val;
                }
                
                this.updateDots();

                // Kalau udah 4 digit, langsung sikat ke n8n
                if (this.pin.length === 4) {
                    setTimeout(() => this.submit(), 200);
                }
            },

            updateDots() {
                for (let i = 1; i <= 4; i++) {
                    const dot = document.getElementById(`dot-${i}`);
                    if (i <= this.pin.length) {
                        dot.classList.add('bg-orange-500', 'border-orange-500');
                        dot.classList.remove('border-zinc-500', 'bg-transparent');
                    } else {
                        dot.classList.remove('bg-orange-500', 'border-orange-500');
                        dot.classList.add('border-zinc-500', 'bg-transparent');
                    }
                }
            },

            async submit() {
                const username = document.getElementById('userSelect').value;
                const errorMsg = document.getElementById('error-msg');

                if (!username) {
                    errorMsg.innerText = "PILIH ID AKSES DULU";
                    errorMsg.style.opacity = '1';
                    this.triggerError();
                    return;
                }

                document.getElementById('loading-overlay').classList.remove('hidden');
                document.getElementById('loading-overlay').classList.add('flex');

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            action: 'login',
                            username: username,
                            password: this.pin
                        })
                    });
                    
                    const data = await res.json();
                    
                    if (data.success || (data[0] && data[0].success)) {
                        // Kalau sukses, simpan data ke LocalStorage biar tau siapa yang lagi login
                        const userData = data.user || data[0].user;
                        localStorage.setItem('dbp_user', JSON.stringify(userData));
                        
                        alert(`Welcome ${userData.role}: ${username}`);
                        // NANTI KITA ARAHIN KE DASHBOARD MASING-MASING DI SINI
                        
                    } else {
                        throw new Error("Invalid PIN");
                    }
                } catch (e) {
                    this.triggerError();
                } finally {
                    document.getElementById('loading-overlay').classList.add('hidden');
                    document.getElementById('loading-overlay').classList.remove('flex');
                }
            },

            triggerError() {
                this.pin = "";
                this.updateDots();
                const container = document.getElementById('pin-dots').parentElement;
                container.classList.add('animate-shake');
                document.getElementById('error-msg').innerText = "AKSES DITOLAK";
                document.getElementById('error-msg').style.opacity = '1';
                setTimeout(() => container.classList.remove('animate-shake'), 400);
            }
        };
    </script>
</body>
</html>
