<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking | Di Bawah Pohon</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #ECECEF; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        
        /* Brutalist Styles */
        .brut-border { border: 2px solid #000000; }
        .brut-overlapping { transform: translate(6px, 6px); }
        .brut-overlapping-offset { transform: translate(-6px, -6px); }
        .extra-bold-title { font-weight: 800; text-transform: uppercase; letter-spacing: -1px; }

        /* Skeleton */
        .skeleton { background: linear-gradient(90deg, #e0e0e0 25%, #d0d0d0 50%, #e0e0e0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="text-gray-900 pb-32">

    <nav class="sticky top-0 z-50 glass border-b brut-border bg-[#ECECEF] px-6 py-4 flex justify-between items-center brut-overlapping-offset shadow-xl">
        <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="h-8 w-auto" alt="Logo DBP">
        <div class="text-[10px] font-bold uppercase tracking-widest text-orange-600 extra-bold-title">Booking System</div>
    </nav>

    <main id="app" class="max-w-md mx-auto px-6 mt-8">
        
        <section id="step-initial">
            <h1 class="extra-bold-title text-4xl mb-1 text-black">Pilih Cabang</h1>
            <p class="text-sm text-gray-600 mb-8 border-l-4 border-orange-500 pl-3">Tentukan lokasi cukur terdekat Anda.</p>
            
            <div id="branch-list" class="space-y-4">
                <div class="h-32 skeleton rounded-3xl brut-border"></div>
                <div class="h-32 skeleton rounded-3xl brut-border"></div>
            </div>
        </section>

        <section id="step-staff" class="hidden animate-in fade-in duration-500">
            <button onclick="APP_LOGIC.resetToStep1()" class="text-xs font-semibold text-orange-600 mb-5 flex items-center brut-border bg-white px-3 py-2 rounded-full">
                ← Kembali Ganti Cabang
            </button>
            <h1 class="extra-bold-title text-4xl mb-1 text-black">Pilih Capster</h1>
            <p id="selected-branch-text" class="text-sm text-gray-600 mb-8 border-l-4 border-orange-500 pl-3"></p>

            <div id="staff-list" class="space-y-6"></div>
        </section>

    </main>

    <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 p-6 glass border-t-4 border-black z-40 shadow-2xl hidden">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-[10px] uppercase text-gray-500 font-bold extra-bold-title">Total Harga</p>
                <p id="display-price" class="text-2xl font-extrabold text-black">Rp 0</p>
            </div>
            <button onclick="APP_LOGIC.openBookingForm()" class="bg-black text-white px-10 py-4 rounded-full font-bold shadow-xl shadow-gray-400 active:scale-95 transition-all extra-bold-title brut-overlapping-offset text-sm">
                Book Now
            </button>
        </div>
    </div>

    <div id="modal-book" class="fixed inset-0 z-[60] glass hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-[#ECECEF] w-full max-w-sm rounded-[32px] p-8 shadow-2xl brut-border brut-overlapping">
            <h2 class="extra-bold-title text-3xl mb-1 text-center text-black">Data Diri</h2>
            <p class="text-xs text-gray-500 text-center mb-8">Mohon isi data untuk antrean.</p>
            
            <div class="space-y-4">
                <input type="text" id="cust_name" placeholder="Nama Lengkap" class="w-full bg-white brut-border rounded-2xl px-5 py-4 focus:ring-4 focus:ring-orange-500 outline-none text-sm font-semibold">
                <input type="tel" id="cust_phone" placeholder="Nomor WhatsApp (08...)" class="w-full bg-white brut-border rounded-2xl px-5 py-4 focus:ring-4 focus:ring-orange-500 outline-none text-sm font-semibold">
                
                <button id="btn-submit" onclick="APP_LOGIC.submitBooking()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-bold mt-4 shadow-xl active:scale-95 transition-all extra-bold-title text-sm brut-overlapping-offset">
                    Konfirmasi Booking
                </button>
                <button onclick="APP_LOGIC.closeModal()" class="w-full text-xs text-gray-400 font-semibold py-2">Batal</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            WEBHOOK_URL: 'GANTI_DENGAN_URL_WEBHOOK_N8N_LO'
        };

        const extractData = (item) => item.json ? item.json : item;

        const APP_LOGIC = {
            state: { branches: [], packages: [], selectedBranch: null, selectedStaff: null, selectedPackage: null, finalPrice: 0 },

            async init() {
                console.log("🚀 Menghubungi n8n...");
                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'get_initial_data' })
                    });
                    
                    const rawData = await res.json();
                    const payload = Array.isArray(rawData) ? rawData[0] : rawData;

                    if (payload && payload.branches) {
                        this.state.branches = Array.isArray(payload.branches) ? payload.branches.map(extractData) : [extractData(payload.branches)];
                        this.state.packages = Array.isArray(payload.packages) ? payload.packages.map(extractData) : [extractData(payload.packages)];
                    } else {
                        console.error("FORMAT ERROR: Cek node Respond Initial di n8n.");
                    }
                    
                    this.renderBranches();
                } catch (e) {
                    console.error("Connection Error:", e);
                    document.getElementById('branch-list').innerHTML = `<p class="text-red-500 text-sm text-center py-4">Gagal terhubung ke server n8n.</p>`;
                }
            },

            renderBranches() {
                const container = document.getElementById('branch-list');
                if (this.state.branches.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">Data cabang kosong.</p>`;
                    return;
                }

                container.innerHTML = this.state.branches.map(b => `
                    <div onclick="APP_LOGIC.selectBranch('${b.dpb_branches_name}')" class="bg-white brut-border p-6 rounded-[28px] shadow-lg flex items-center gap-5 hover:scale-95 transition-all cursor-pointer relative overflow-hidden">
                        <img src="${b.photo_url || 'https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/BRANCH_PHOTOS/DBP_KEMANG.jpg'}" class="w-20 h-20 rounded-2xl object-cover border-2 border-orange-50 brut-overlapping-offset">
                        <div class="flex-1">
                            <h3 class="font-extrabold text-2xl text-black extra-bold-title">${b.dpb_branches_name}</h3>
                            <p class="text-xs text-orange-600 font-bold uppercase tracking-widest">${b.dbp_location || 'Lokasi Tersedia'}</p>
                        </div>
                        <span class="text-black font-extrabold text-2xl transform scale-x-[-1]">←</span>
                    </div>
                `).join('');
            },

            async selectBranch(name) {
                this.state.selectedBranch = name;
                document.getElementById('step-initial').classList.add('hidden');
                document.getElementById('step-staff').classList.remove('hidden');
                document.getElementById('selected-branch-text').innerText = `Menampilkan Capster di ${name}`;
                document.getElementById('staff-list').innerHTML = `<div class="h-60 skeleton rounded-[32px] brut-border"></div>`;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'get_staff_list', branch_name: name })
                    });
                    
                    const rawStaff = await res.json();
                    const staffData = (Array.isArray(rawStaff) ? rawStaff : [rawStaff]).map(extractData);
                    this.renderStaff(staffData);
                } catch (e) { 
                    console.error("Error Staff:", e); 
                    document.getElementById('staff-list').innerHTML = `<p class="text-red-500 text-sm">Gagal memuat data Capster.</p>`;
                }
            },

            renderStaff(staffs) {
                const container = document.getElementById('staff-list');
                if (!staffs || staffs.length === 0 || !staffs[0].id) {
                    container.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">Tidak ada capster di cabang ini.</p>`;
                    return;
                }

                container.innerHTML = staffs.map(s => `
                    <div class="bg-white border-4 border-black rounded-[32px] shadow-2xl mb-6 relative overflow-visible brut-overlapping-offset">
                        
                        ${s.is_top_performance ? '<div class="absolute -top-4 -right-2 glass bg-orange-600 border-2 border-black text-white text-[10px] font-extrabold px-6 py-2 rounded-full shadow-2xl z-10 extra-bold-title">Top Performance</div>' : ''}
                        
                        <div class="p-8">
                            <div class="flex items-start gap-5 mb-8">
                                <img src="${s.photo_url || 'https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/STAFF_PROFILE/BARBER_MAX.png'}" 
                                     class="w-24 h-24 rounded-[32px] object-cover border-4 border-black object-top shadow-xl">
                                <div>
                                    <h4 class="font-extrabold text-2xl text-black extra-bold-title">${s.dbp_staff_name}</h4>
                                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest border-2 border-gray-100 bg-gray-50 px-3 py-1 rounded-full mt-1 inline-block">${s.role}</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 gap-3">
                                ${(s.services || []).map(ser => `
                                    <button onclick="APP_LOGIC.prepareBooking('${s.id}', '${ser.id}', ${ser.price})" class="flex justify-between items-center py-4 px-5 rounded-2xl border-2 border-black hover:border-orange-200 hover:bg-orange-50 transition-all text-left bg-white">
                                        <span class="text-sm font-semibold">${ser.name}</span>
                                        <span class="text-sm font-bold text-orange-600">Rp ${Number(ser.price).toLocaleString('id-ID')}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            prepareBooking(staffId, packageId, price) {
                this.state.selectedStaff = staffId;
                this.state.selectedPackage = packageId;
                this.state.finalPrice = price;
                document.getElementById('display-price').innerText = `Rp ${price.toLocaleString('id-ID')}`;
                document.getElementById('bottom-bar').classList.remove('hidden');
            },

            openBookingForm() { document.getElementById('modal-book').classList.remove('hidden'); },
            closeModal() { document.getElementById('modal-book').classList.add('hidden'); },

            async submitBooking() {
                const name = document.getElementById('cust_name').value.trim();
                const phone = document.getElementById('cust_phone').value.trim();

                if(!name || !phone) return alert('Lengkapi data dulu, Bos.');

                const btn = document.getElementById('btn-submit');
                btn.innerText = "Processing..."; btn.disabled = true;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            action: 'submit_booking', cust_name: name, cust_phone: phone,
                            branch_id: this.state.selectedBranch, capster_id: this.state.selectedStaff,
                            package_id: this.state.selectedPackage, price: this.state.finalPrice
                        })
                    });
                    
                    if(res.ok) {
                        alert('Booking Sukses! Silakan tunggu konfirmasi WA dari kami.');
                        location.reload();
                    } else {
                        throw new Error("Server response not OK");
                    }
                } catch (e) { 
                    alert('Gagal kirim data booking.'); 
                    btn.innerText = "Konfirmasi Booking"; btn.disabled = false;
                }
            },

            resetToStep1() {
                document.getElementById('step-initial').classList.remove('hidden');
                document.getElementById('step-staff').classList.add('hidden');
                document.getElementById('bottom-bar').classList.add('hidden');
            }
        };

        window.onload = () => APP_LOGIC.init();
    </script>
</body>
</html>
