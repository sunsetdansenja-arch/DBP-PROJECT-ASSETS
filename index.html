<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking | Di Bawah Pohon</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #F4F4F5; }
        .glass { background: rgba(244, 244, 245, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        /* Industrial Brutalism Styles */
        .brutal-border { border: 3px solid #18181B; }
        .brutal-shadow { box-shadow: 6px 6px 0px 0px #18181B; }
        .brutal-shadow-sm { box-shadow: 4px 4px 0px 0px #18181B; }
        .hover-brutal:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px 0px #18181B; }
        .active-brutal:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #18181B; }

        /* Exclusive Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .skeleton { background: linear-gradient(90deg, #e4e4e7 25%, #d4d4d8 50%, #e4e4e7 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="text-zinc-900 pb-32">

    <nav class="sticky top-0 z-50 glass border-b-4 border-zinc-900 px-6 py-5 flex justify-between items-center transition-all">
        <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="h-8 w-auto" alt="Logo DBP">
        <div class="text-[10px] font-black uppercase tracking-widest text-orange-600 bg-orange-100 px-3 py-1 rounded-md brutal-border brutal-shadow-sm">Booking</div>
    </nav>

    <main id="app" class="max-w-md mx-auto px-5 mt-10">
        
        <section id="step-initial" class="animate-slide-up">
            <h1 class="font-black text-4xl mb-2 tracking-tighter uppercase leading-none">Pilih<br>Cabang</h1>
            <p class="text-sm font-semibold text-zinc-500 mb-8">Tentukan lokasi cukur terdekat Anda.</p>
            
            <div id="branch-list" class="space-y-5">
                <div class="h-28 skeleton rounded-[24px] brutal-border"></div>
                <div class="h-28 skeleton rounded-[24px] brutal-border"></div>
            </div>
        </section>

        <section id="step-staff" class="hidden animate-slide-up">
            <button onclick="APP_LOGIC.resetToStep1()" class="text-xs font-black text-zinc-900 mb-6 flex items-center bg-white brutal-border px-4 py-2 rounded-xl brutal-shadow-sm active-brutal transition-all uppercase tracking-wider">
                ← Ganti Cabang
            </button>
            <h1 class="font-black text-4xl mb-2 tracking-tighter uppercase leading-none">Pilih<br>Capster</h1>
            <p id="selected-branch-text" class="text-sm font-semibold text-orange-600 mb-8 uppercase tracking-wide"></p>

            <div id="staff-list" class="space-y-8"></div>
        </section>

    </main>

    <div id="bottom-bar" class="fixed bottom-6 left-5 right-5 z-40 hidden animate-slide-up">
        <div class="max-w-md mx-auto bg-white brutal-border brutal-shadow rounded-[32px] p-5 flex justify-between items-center">
            <div>
                <p class="text-[10px] uppercase text-zinc-500 font-black tracking-wider">Total Harga</p>
                <p id="display-price" class="text-2xl font-black text-zinc-900 tracking-tighter">Rp 0</p>
            </div>
            <button onclick="APP_LOGIC.openBookingForm()" class="bg-orange-600 text-white px-8 py-4 rounded-2xl font-black uppercase tracking-wide brutal-border brutal-shadow-sm active-brutal transition-all">
                Lanjut
            </button>
        </div>
    </div>

    <div id="modal-book" class="fixed inset-0 z-[60] glass hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[36px] p-8 brutal-border brutal-shadow animate-slide-up">
            <h2 class="font-black text-3xl mb-1 text-center tracking-tighter uppercase">Data Diri</h2>
            <p class="text-xs font-semibold text-zinc-500 text-center mb-8">Mohon isi data untuk antrean.</p>
            
            <div class="space-y-4">
                <input type="text" id="cust_name" placeholder="NAMA LENGKAP" class="w-full bg-zinc-100 brutal-border rounded-[20px] px-5 py-4 focus:ring-4 focus:ring-orange-500 outline-none text-sm font-black uppercase placeholder-zinc-400">
                <input type="tel" id="cust_phone" placeholder="WHATSAPP (08...)" class="w-full bg-zinc-100 brutal-border rounded-[20px] px-5 py-4 focus:ring-4 focus:ring-orange-500 outline-none text-sm font-black uppercase placeholder-zinc-400">
                
                <button id="btn-submit" onclick="APP_LOGIC.submitBooking()" class="w-full bg-zinc-900 text-white py-4 rounded-[20px] font-black uppercase tracking-wide mt-4 brutal-border brutal-shadow-sm active-brutal transition-all">
                    Booking Sekarang
                </button>
                <button onclick="APP_LOGIC.closeModal()" class="w-full text-xs font-black text-zinc-400 uppercase tracking-widest py-4 active:scale-95 transition-all">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // LOGIKA CHECKPOINT 1: DIJAGA KETAT, URL SUDAH HARDCODED
        const CONFIG = {
            WEBHOOK_URL: 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/dbp-public'
        };

        const extractData = (item) => item.json ? item.json : item;

        const APP_LOGIC = {
            state: { branches: [], packages: [], selectedBranch: null, selectedStaff: null, selectedPackage: null, finalPrice: 0 },

            async init() {
                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'get_initial_data' })
                    });
                    
                    const data = await res.json();
                    const payload = Array.isArray(data) ? data[0] : data;
                    
                    this.state.branches = payload.branches || [];
                    this.state.packages = payload.packages || [];
                    
                    this.renderBranches();
                } catch (e) {
                    console.error("Connection Error:", e);
                    document.getElementById('branch-list').innerHTML = `<p class="text-red-600 font-bold text-sm text-center py-4 brutal-border bg-red-50 rounded-2xl">Gagal terhubung ke server.</p>`;
                }
            },

            renderBranches() {
                const container = document.getElementById('branch-list');
                if (this.state.branches.length === 0) return;

                container.innerHTML = this.state.branches.map((b, index) => `
                    <div onclick="APP_LOGIC.selectBranch('${b.dpb_branches_name}')" 
                         class="group bg-white brutal-border p-4 rounded-[28px] brutal-shadow-sm hover-brutal active-brutal transition-all cursor-pointer flex items-center gap-4"
                         style="animation-delay: ${index * 0.1}s">
                        <img src="${b.photo_url || 'https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png'}" 
                             class="w-20 h-20 rounded-[20px] object-cover brutal-border">
                        <div class="flex-1">
                            <h3 class="font-black text-xl text-zinc-900 tracking-tight leading-tight uppercase">${b.dpb_branches_name}</h3>
                            <p class="text-[10px] font-black text-orange-600 uppercase tracking-widest mt-1">${b.dbp_location || 'Lokasi Tersedia'}</p>
                        </div>
                        <div class="bg-zinc-100 p-3 rounded-full brutal-border group-hover:bg-orange-500 group-hover:text-white transition-colors">
                            <span class="font-black">→</span>
                        </div>
                    </div>
                `).join('');
            },

            async selectBranch(name) {
                this.state.selectedBranch = name;
                document.getElementById('step-initial').classList.add('hidden');
                document.getElementById('step-staff').classList.remove('hidden');
                document.getElementById('selected-branch-text').innerText = name;
                document.getElementById('staff-list').innerHTML = `<div class="h-64 skeleton rounded-[32px] brutal-border"></div>`;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'get_staff_list', branch_name: name })
                    });
                    
                    const staffData = await res.json();
                    this.renderStaff(Array.isArray(staffData) ? staffData : [staffData]);
                } catch (e) { 
                    console.error("Error Staff:", e); 
                }
            },

            renderStaff(staffs) {
                const container = document.getElementById('staff-list');
                if (!staffs || staffs.length === 0 || !staffs[0].id) {
                    container.innerHTML = `<p class="text-zinc-500 font-bold text-sm text-center py-4">Tidak ada capster tersedia.</p>`;
                    return;
                }

                container.innerHTML = staffs.map((s, index) => `
                    <div class="bg-white brutal-border rounded-[32px] brutal-shadow p-5 relative animate-slide-up" style="animation-delay: ${index * 0.1}s">
                        
                        ${s.is_top_performance ? '<div class="absolute -top-3 -right-2 bg-orange-600 brutal-border text-white text-[10px] font-black px-4 py-1.5 rounded-xl brutal-shadow-sm uppercase tracking-widest transform rotate-3 z-10">🔥 Top Performance</div>' : ''}
                        
                        <div class="w-full h-56 mb-5">
                            <img src="${s.photo_url || 'https://via.placeholder.com/150'}" 
                                 class="w-full h-full rounded-[24px] object-cover object-top brutal-border">
                        </div>

                        <div class="mb-5 flex justify-between items-end">
                            <div>
                                <h4 class="font-black text-3xl text-zinc-900 tracking-tighter uppercase leading-none">${s.dbp_staff_name}</h4>
                                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mt-2 bg-zinc-100 inline-block px-3 py-1 rounded-md brutal-border">${s.role}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-3">
                            ${(s.services || []).map(ser => `
                                <button onclick="APP_LOGIC.prepareBooking('${s.id}', '${ser.id}', ${ser.price})" 
                                        class="group flex justify-between items-center py-4 px-5 rounded-[20px] brutal-border bg-white hover:bg-orange-50 active-brutal transition-all text-left">
                                    <span class="text-sm font-black text-zinc-700 group-hover:text-black uppercase">${ser.name}</span>
                                    <span class="text-base font-black text-orange-600">Rp ${Number(ser.price).toLocaleString('id-ID')}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            },

            prepareBooking(staffId, packageId, price) {
                this.state.selectedStaff = staffId;
                this.state.selectedPackage = packageId;
                this.state.finalPrice = price;
                document.getElementById('display-price').innerText = `Rp ${price.toLocaleString('id-ID')}`;
                document.getElementById('bottom-bar').classList.remove('hidden');
            },

            openBookingForm() { document.getElementById('modal-book').classList.remove('hidden'); },
            closeModal() { document.getElementById('modal-book').classList.add('hidden'); },

            async submitBooking() {
                const name = document.getElementById('cust_name').value.trim();
                const phone = document.getElementById('cust_phone').value.trim();

                if(!name || !phone) return alert('Lengkapi data dulu.');

                const btn = document.getElementById('btn-submit');
                btn.innerText = "LOADING..."; btn.disabled = true;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            action: 'submit_booking', cust_name: name, cust_phone: phone,
                            branch_id: this.state.selectedBranch, capster_id: this.state.selectedStaff,
                            package_id: this.state.selectedPackage, price: this.state.finalPrice
                        })
                    });
                    
                    if(res.ok) {
                        alert('Booking Sukses! Silakan tunggu konfirmasi WA dari kami.');
                        location.reload();
                    } else {
                        throw new Error("Server response not OK");
                    }
                } catch (e) { 
                    alert('Gagal kirim data booking.'); 
                    btn.innerText = "BOOKING SEKARANG"; btn.disabled = false;
                }
            },

            resetToStep1() {
                document.getElementById('step-initial').classList.remove('hidden');
                document.getElementById('step-staff').classList.add('hidden');
                document.getElementById('bottom-bar').classList.add('hidden');
            }
        };

        window.onload = () => APP_LOGIC.init();
    </script>
</body>
</html>
