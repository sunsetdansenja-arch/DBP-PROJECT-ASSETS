<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking | Di Bawah Pohon</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F7; color: #1D1D1F; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        /* Apple Elegant Styles */
        .apple-shadow { box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); }
        .apple-shadow-lg { box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08); }
        .apple-card { background: #FFFFFF; border: 1px solid #E5E5EA; border-radius: 24px; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #E5E5EA; }
        .btn-press:active { transform: scale(0.97); }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes pulseSoft { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.02); } }
        .animate-pulse-soft { animation: pulseSoft 2s infinite ease-in-out; }
        @keyframes slideOutUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; visibility: hidden; } }
        .slide-out-up { animation: slideOutUp 0.6s cubic-bezier(0.85, 0, 0.15, 1) forwards; }
    </style>
</head>
<body class="text-zinc-900 pb-32">

    <div id="splash-screen" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-all duration-700">
        <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="w-32 mb-6 animate-pulse-soft" style="filter: invert(1);" alt="DBP Logo">
        <p class="text-sm font-semibold text-zinc-400 tracking-widest uppercase">Connecting to Server...</p>
    </div>

    <div id="success-screen" class="fixed inset-0 z-[100] bg-zinc-900/40 backdrop-blur-md hidden flex-col items-center justify-center p-6 transition-all duration-500">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 apple-shadow-lg relative flex flex-col items-center animate-slide-up">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h1 class="text-zinc-900 font-bold text-2xl tracking-tight mb-2 text-center">Booking Berhasil!</h1>
            <p class="text-sm font-medium text-zinc-500 text-center mb-8">Jadwal Anda telah diamankan. Tunjukkan struk ini kepada kasir kami.</p>
            
            <div class="w-full bg-zinc-50 rounded-2xl p-5 mb-6 border border-zinc-100">
                <div class="flex justify-between items-center mb-3 border-b border-zinc-200 pb-3">
                    <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Cabang</span>
                    <span id="receipt-branch" class="text-sm font-bold text-zinc-900 text-right">...</span>
                </div>
                <div class="flex justify-between items-center mb-3 border-b border-zinc-200 pb-3">
                    <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Barber</span>
                    <span id="receipt-capster" class="text-sm font-bold text-zinc-900 text-right">...</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Jadwal</span>
                    <span id="receipt-time" class="text-sm font-bold text-blue-600 text-right">...</span>
                </div>
            </div>
            
            <a href="#" id="receipt-maps" target="_blank" class="w-full text-center bg-zinc-900 text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-zinc-800 transition-all mb-4 btn-press">
                📍 Buka Rute Maps
            </a>
            
            <button onclick="location.reload()" class="text-xs font-bold text-zinc-400 uppercase tracking-widest hover:text-zinc-600 transition-colors">Tutup & Kembali</button>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass px-6 py-4 flex justify-between items-center apple-shadow">
        <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="h-8 w-auto" style="filter: invert(1);" alt="Logo DBP">
        <div class="text-[10px] font-bold uppercase tracking-widest text-green-700 bg-green-100 px-3 py-1.5 rounded-full flex items-center gap-2">
            <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div> Live
        </div>
    </nav>

    <main id="app" class="max-w-md mx-auto px-5 mt-8 relative z-10">
        
        <section id="step-initial" class="animate-slide-up">
            <h1 class="font-bold text-3xl mb-1 tracking-tight text-zinc-900">Pilih Cabang</h1>
            <p class="text-sm font-medium text-zinc-500 mb-8">Tentukan lokasi Di Bawah Pohon terdekat.</p>

            <div id="branch-list" class="space-y-6 hidden"></div>
        </section>

        <section id="step-staff" class="hidden animate-slide-up">
            <button onclick="APP_LOGIC.resetToStep1()" class="text-sm font-bold text-zinc-500 mb-6 flex items-center hover:text-zinc-900 transition-colors btn-press">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Kembali
            </button>
            <h1 class="font-bold text-3xl mb-1 tracking-tight text-zinc-900">Pilih Barber</h1>
            <p id="selected-branch-text" class="text-sm font-bold text-blue-600 mb-8 bg-blue-50 inline-block px-3 py-1 rounded-lg"></p>
            
            <div id="staff-list" class="space-y-6"></div>
        </section>
    </main>

    <div id="bottom-bar" class="fixed bottom-6 left-5 right-5 z-40 hidden animate-slide-up">
        <div class="max-w-md mx-auto glass border border-zinc-200 apple-shadow-lg rounded-[24px] p-4 flex justify-between items-center">
            <div class="pl-2">
                <p class="text-[10px] uppercase text-zinc-500 font-bold tracking-widest">Total Biaya</p>
                <p id="display-price" class="text-xl font-bold text-zinc-900 tracking-tight">Rp 0</p>
            </div>
            <button onclick="APP_LOGIC.openBookingForm()" class="btn-press bg-zinc-900 text-white px-8 py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-zinc-800 transition-all">
                Lanjut
            </button>
        </div>
    </div>

    <div id="modal-book" class="fixed inset-0 z-[60] bg-zinc-900/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-4 transition-all">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-6 sm:p-8 apple-shadow-lg animate-slide-up max-h-[90vh] overflow-y-auto hide-scrollbar border border-zinc-100">
            <h2 class="font-bold text-2xl mb-1 text-center tracking-tight text-zinc-900">Finalisasi</h2>
            <p class="text-xs font-semibold text-zinc-500 text-center mb-6 uppercase tracking-wider">Lengkapi Data Anda</p>
            
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-2 block">Pilih Tanggal</label>
                    <div id="date-slots" class="flex gap-2 overflow-x-auto hide-scrollbar pb-2"></div>
                    <input type="hidden" id="booking_date" value="">
                </div>

                <div>
                    <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-2 block">Pilih Jam</label>
                    <div id="time-slots" class="grid grid-cols-3 gap-2"></div>
                    <input type="hidden" id="booking_time" value="">
                </div>

                <div class="border-t border-zinc-100 pt-5 space-y-3">
                    <input type="text" id="cust_name" placeholder="Nama Lengkap" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3.5 focus:border-zinc-400 focus:bg-white outline-none text-sm font-semibold text-zinc-900 placeholder-zinc-400 transition-all">
                    <input type="tel" id="cust_phone" placeholder="No. WhatsApp (08...)" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3.5 focus:border-zinc-400 focus:bg-white outline-none text-sm font-semibold text-zinc-900 placeholder-zinc-400 transition-all">
                </div>
                
                <button id="btn-submit" onclick="APP_LOGIC.submitBooking()" class="btn-press w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-blue-700 transition-all mt-2">
                    Konfirmasi Booking
                </button>
                <button onclick="APP_LOGIC.closeModal()" class="btn-press w-full text-xs font-bold text-zinc-400 uppercase tracking-widest py-3 hover:text-zinc-600 transition-colors">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // WEBHOOK N8N PINTU 1 (BOOKING PUBLIC)
        // ==========================================
        const CONFIG = {
            WEBHOOK_URL: 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/dbp-public',
            AVAILABLE_HOURS: ["10:00", "11:00", "12:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"]
        };

        const extractData = (item) => item.json ? item.json : item;
        const delay = ms => new Promise(res => setTimeout(res, ms));

        const BRANCH_DATA = {
            "DI BAWAH POHON KEMANG": { img: "https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/DBP%20KEMANG.jpg", rating: "4.9", rev: "150+", tags: "☕ Free Coffee &bull; 🎮 PS5" },
            "DI BAWAH POHON CANGGU": { img: "https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/DBP%20CANGGU.jpg", rating: "4.8", rev: "210+", tags: "🍻 Welcome Drink" }
        };

        const APP_LOGIC = {
            state: { 
                branches: [], packages: [], staffs: [], 
                selectedBranch: null, 
                selectedStaffId: null, selectedStaffName: null, 
                selectedPackageId: null, selectedPackageName: null, 
                finalPrice: 0 
            },

            async init() {
                try {
                    const fetchPromise = fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'get_initial_data' })
                    }).then(res => res.json());

                    const [rawData] = await Promise.all([fetchPromise, delay(1500)]);
                    const payload = Array.isArray(rawData) ? rawData[0] : rawData;
                    
                    this.state.branches = payload.branches ? (Array.isArray(payload.branches) ? payload.branches.map(extractData) : [extractData(payload.branches)]) : [];
                    this.state.packages = payload.packages ? (Array.isArray(payload.packages) ? payload.packages.map(extractData) : [extractData(payload.packages)]) : [];
                    
                    document.getElementById('branch-list').classList.remove('hidden');
                    this.renderBranches();
                    
                    const splash = document.getElementById('splash-screen');
                    splash.classList.add('slide-out-up');
                    setTimeout(() => splash.remove(), 600);
                } catch (e) {
                    console.error("Connection Error:", e);
                    document.getElementById('splash-screen').innerHTML = `<p class="text-zinc-900 font-bold text-lg">Gagal terhubung ke server.</p><button onclick="location.reload()" class="mt-4 bg-zinc-100 px-4 py-2 rounded-lg text-sm font-bold">Coba Lagi</button>`;
                }
            },

            renderBranches() {
                const container = document.getElementById('branch-list');
                if (this.state.branches.length === 0) return;

                container.innerHTML = this.state.branches.map((b, index) => {
                    const meta = BRANCH_DATA[b.dpb_branches_name] || { img: "https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png", rating: "4.8", rev: "100+", tags: "Premium Barbershop" };
                    const gmapsLink = b.gmaps || '#'; 

                    return `
                    <div onclick="APP_LOGIC.selectBranch('${b.dpb_branches_name}')" class="apple-card apple-shadow overflow-hidden cursor-pointer btn-press transition-all animate-slide-up" style="animation-delay: ${index * 0.1}s">
                        <div class="relative w-full h-56">
                            <img src="${meta.img}" class="w-full h-full object-cover">
                            <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm font-bold text-xs px-3 py-1.5 rounded-full flex items-center shadow-sm">
                                ⭐️ ${meta.rating} <span class="text-[10px] text-zinc-500 ml-1">(${meta.rev})</span>
                            </div>
                            <a href="${gmapsLink}" target="_blank" onclick="event.stopPropagation()" class="absolute bottom-4 right-4 bg-zinc-900/80 backdrop-blur-sm text-white font-semibold text-[10px] px-3 py-1.5 rounded-lg hover:bg-zinc-900 transition-colors z-20">
                                📍 Maps
                            </a>
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-xl text-zinc-900 tracking-tight mb-1">
                                ${b.dpb_branches_name.replace('DI BAWAH POHON ', '')}
                            </h3>
                            <p class="text-xs font-medium text-zinc-500">${meta.tags}</p>
                        </div>
                    </div>`;
                }).join('');
            },

            async selectBranch(name) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.state.selectedBranch = name;
                document.getElementById('step-initial').classList.add('hidden');
                document.getElementById('step-staff').classList.remove('hidden');
                document.getElementById('selected-branch-text').innerText = name.replace('DI BAWAH POHON ', 'Cabang ');
                
                document.getElementById('staff-list').innerHTML = `
                    <div class="bg-zinc-50 border border-zinc-100 rounded-2xl p-8 text-center animate-pulse">
                        <p class="font-semibold text-zinc-400 text-sm">Menyiapkan jadwal barber...</p>
                    </div>`;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action: 'get_staff_list', branch_name: name })
                    });
                    const rawStaff = await res.json();
                    this.state.staffs = (Array.isArray(rawStaff) ? rawStaff : [rawStaff]).map(extractData);
                    this.renderStaff(this.state.staffs);
                } catch (e) {}
            },

            renderStaff(staffs) {
                const container = document.getElementById('staff-list');
                if (!staffs || staffs.length === 0 || !staffs[0].id) {
                    return container.innerHTML = `<p class="text-zinc-500 font-medium text-sm text-center py-4">Tidak ada capster tersedia hari ini.</p>`;
                }

                container.innerHTML = staffs.map((s, index) => `
                    <div class="apple-card p-5 relative animate-slide-up" style="animation-delay: ${index * 0.1}s">
                        ${s.is_top_performance ? '<div class="absolute -top-3 -right-2 bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-md uppercase tracking-wider z-10">Top Rated</div>' : ''}
                        <div class="flex items-center gap-4 mb-5">
                            <img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-full object-cover object-top border-2 border-zinc-100">
                            <div>
                                <h4 class="font-bold text-lg text-zinc-900 leading-tight">${s.dbp_staff_name}</h4>
                                <p class="text-xs font-semibold text-zinc-500 bg-zinc-100 inline-block px-2 py-0.5 rounded mt-1">${s.role}</p>
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${(s.services || []).map(ser => `
                                <button onclick="APP_LOGIC.prepareBooking('${s.id}', '${ser.id}', ${ser.price})" class="group w-full flex justify-between items-center p-4 rounded-xl border border-zinc-100 bg-zinc-50 hover:border-blue-200 hover:bg-blue-50 transition-all text-left btn-press">
                                    <span class="text-sm font-bold text-zinc-700 group-hover:text-blue-700">${ser.name}</span>
                                    <span class="text-sm font-bold text-zinc-900 group-hover:text-blue-700">Rp ${Number(ser.price).toLocaleString('id-ID')}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>`).join('');
            },

            prepareBooking(staffId, packageId, price) {
                // Cari nama dari state untuk dikirim ke n8n
                const staff = this.state.staffs.find(s => s.id == staffId);
                const service = staff ? staff.services.find(sr => sr.id == packageId) : null;
                
                this.state.selectedStaffId = staffId;
                this.state.selectedStaffName = staff ? staff.dbp_staff_name : staffId;
                this.state.selectedPackageId = packageId;
                this.state.selectedPackageName = service ? service.name : packageId;
                this.state.finalPrice = price;

                document.getElementById('display-price').innerText = `Rp ${price.toLocaleString('id-ID')}`;
                document.getElementById('bottom-bar').classList.remove('hidden');
                document.getElementById('bottom-bar').classList.add('flex');
            },

            generateDates() {
                const dates = []; const today = new Date();
                const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
                const dayNames = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
                for(let i=0; i<8; i++) {
                    const d = new Date(today); d.setDate(d.getDate() + i);
                    const day = d.getDate().toString().padStart(2, '0');
                    const value = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${day}`;
                    dates.push({ display: i === 0 ? "Hari Ini" : `${dayNames[d.getDay()]}, ${day} ${monthNames[d.getMonth()]}`, value });
                }
                return dates;
            },

            openBookingForm() { 
                document.getElementById('booking_date').value = ''; document.getElementById('booking_time').value = '';
                this.renderDateSlots(); this.renderTimeSlots();
                document.getElementById('modal-book').classList.remove('hidden'); document.getElementById('modal-book').classList.add('flex'); 
            },
            
            closeModal() { 
                document.getElementById('modal-book').classList.add('hidden'); document.getElementById('modal-book').classList.remove('flex'); 
            },

            renderDateSlots() {
                document.getElementById('date-slots').innerHTML = this.generateDates().map(d => `
                    <button id="btn-date-${d.value}" onclick="APP_LOGIC.selectDate('${d.value}')" class="date-btn flex-shrink-0 bg-zinc-50 border border-zinc-200 text-zinc-600 px-4 py-2.5 rounded-xl text-xs font-bold hover:border-blue-400 transition-all whitespace-nowrap btn-press">${d.display}</button>
                `).join('');
            },

            selectDate(dateValue) {
                document.getElementById('booking_date').value = dateValue;
                document.querySelectorAll('.date-btn').forEach(btn => {
                    btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    btn.classList.add('bg-zinc-50', 'text-zinc-600', 'border-zinc-200');
                });
                const sBtn = document.getElementById(`btn-date-${dateValue}`);
                sBtn.classList.remove('bg-zinc-50', 'text-zinc-600', 'border-zinc-200');
                sBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                document.getElementById('booking_time').value = '';
                this.renderTimeSlots();
            },

            renderTimeSlots() {
                const container = document.getElementById('time-slots'); const selDate = document.getElementById('booking_date').value;
                if (!selDate) return container.innerHTML = `<div class="col-span-3 text-center py-3 text-[10px] font-bold text-zinc-400 uppercase tracking-widest border border-dashed border-zinc-200 rounded-lg">Pilih Tanggal Dulu</div>`;
                
                const staff = this.state.staffs.find(s => s.id == this.state.selectedStaffId);
                const bookedSlots = staff ? (staff.booked_slots || []) : [];

                container.innerHTML = CONFIG.AVAILABLE_HOURS.map(h => {
                    if (bookedSlots.some(slot => String(slot).includes(selDate) && String(slot).includes(h))) {
                        return `<button disabled class="w-full bg-zinc-100 border border-zinc-200 text-zinc-400 py-2.5 rounded-lg text-xs font-bold opacity-60 cursor-not-allowed line-through">${h}</button>`;
                    } else {
                        return `<button id="btn-time-${h.replace(':','')}" onclick="APP_LOGIC.selectTime('${h}')" class="time-btn w-full bg-white border border-zinc-200 text-zinc-700 py-2.5 rounded-lg text-xs font-bold hover:border-blue-400 transition-all btn-press">${h}</button>`;
                    }
                }).join('');
            },

            selectTime(hour) {
                document.getElementById('booking_time').value = hour;
                document.querySelectorAll('.time-btn').forEach(btn => {
                    btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    btn.classList.add('bg-white', 'text-zinc-700', 'border-zinc-200');
                });
                const sBtn = document.getElementById(`btn-time-${hour.replace(':','')}`);
                sBtn.classList.remove('bg-white', 'text-zinc-700', 'border-zinc-200');
                sBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
            },

            async submitBooking() {
                const name = document.getElementById('cust_name').value.trim();
                const phone = document.getElementById('cust_phone').value.trim();
                const tanggal = document.getElementById('booking_date').value;
                const jam = document.getElementById('booking_time').value;

                if(!name || !phone || !tanggal || !jam) return alert('Mohon lengkapi semua data.');

                const btn = document.getElementById('btn-submit');
                btn.innerText = "Memproses..."; btn.disabled = true;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            action: 'submit_booking', cust_name: name, cust_phone: phone, tanggal: tanggal, jam: jam,
                            branch_id: this.state.selectedBranch, 
                            capster_id: this.state.selectedStaffId, 
                            caps_in_charge: this.state.selectedStaffName,   // NAMA CAPSTER DIKIRIM
                            package_id: this.state.selectedPackageId, 
                            package_name: this.state.selectedPackageName,   // NAMA PAKET DIKIRIM
                            price: this.state.finalPrice
                        })
                    });
                    
                    if(res.ok) {
                        document.getElementById('receipt-branch').innerText = this.state.selectedBranch.replace('DI BAWAH POHON ', '');
                        document.getElementById('receipt-capster').innerText = this.state.selectedStaffName;
                        document.getElementById('receipt-time').innerText = `${tanggal} | ${jam}`;
                        
                        const bData = this.state.branches.find(b => b.dpb_branches_name === this.state.selectedBranch);
                        const mapBtn = document.getElementById('receipt-maps');
                        if(bData && bData.gmaps) { mapBtn.href = bData.gmaps; mapBtn.style.display = 'block'; } else { mapBtn.style.display = 'none'; }

                        this.closeModal();
                        const sScreen = document.getElementById('success-screen');
                        sScreen.classList.remove('hidden'); sScreen.classList.add('flex');
                    } else throw new Error();
                } catch (e) { 
                    alert('Gagal memproses booking. Coba lagi.'); 
                    btn.innerText = "Konfirmasi Booking"; btn.disabled = false;
                }
            },

            resetToStep1() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.getElementById('step-initial').classList.remove('hidden');
                document.getElementById('step-staff').classList.add('hidden');
                document.getElementById('bottom-bar').classList.add('hidden'); document.getElementById('bottom-bar').classList.remove('flex');
            }
        };

        window.onload = () => APP_LOGIC.init();
    </script>
</body>
</html>
