<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking | Di Bawah Pohon</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root { --dbp-orange: #E67E22; }
        body { font-family: 'Inter', sans-serif; background-color: #FBFBFD; }
        .serif-title { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="text-gray-900 pb-24">

    <nav class="sticky top-0 z-50 glass border-b border-gray-200/50 px-6 py-4 flex justify-between items-center">
        <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/DBP-PROJECT-ASSETS/main/LOGO%20DI%20BAWAH%20POHON.png" class="h-8 w-auto" alt="Logo DBP">
        <div class="text-[10px] font-bold uppercase tracking-widest text-gray-400">Booking System</div>
    </nav>

    <main id="app" class="max-w-md mx-auto px-6 mt-8">
        <section id="step-initial">
            <h1 class="serif-title text-3xl mb-2">Pilih Cabang</h1>
            <p class="text-sm text-gray-500 mb-6">Tentukan lokasi cukur terdekat Anda.</p>
            <div id="branch-list" class="space-y-3">
                <div class="h-20 skeleton rounded-3xl"></div>
                <div class="h-20 skeleton rounded-3xl"></div>
            </div>
        </section>

        <section id="step-staff" class="hidden">
            <button onclick="APP_LOGIC.resetToStep1()" class="text-xs font-semibold text-orange-600 mb-4">← Ganti Cabang</button>
            <h1 class="serif-title text-3xl mb-2">Pilih Capster</h1>
            <div id="staff-list" class="space-y-4"></div>
        </section>
    </main>

    <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 p-6 glass border-t border-gray-200/50 hidden">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <p id="display-price" class="text-xl font-bold">Rp 0</p>
            <button onclick="APP_LOGIC.openBookingForm()" class="bg-orange-500 text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-orange-200">Book Now</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            // URL SUDAH GUE FIX KE PRODUCTION
            WEBHOOK_URL: 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/dbp-public'
        };

        const APP_LOGIC = {
            state: { branches: [], packages: [], selectedBranch: null },

            async init() {
                console.log("🚀 Menghubungi n8n...");
                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_initial_data' })
                    });

                    if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

                    const data = await res.json();
                    console.log("✅ Data diterima:", data);
                    this.state.branches = data.branches;
                    this.state.packages = data.packages;
                    this.renderBranches();
                } catch (e) {
                    console.error("❌ Error Fetch:", e);
                    alert("Gagal terhubung ke server n8n. Pastikan workflow sudah ACTIVE dan 'Respond to Options Requests' sudah dicentang.");
                }
            },

            renderBranches() {
                const container = document.getElementById('branch-list');
                container.innerHTML = this.state.branches.map(b => `
                    <div onclick="APP_LOGIC.selectBranch('${b.dpb_branches_name}')" 
                         class="bg-white border border-gray-100 p-5 rounded-[24px] shadow-sm flex justify-between items-center active:scale-95 transition-all cursor-pointer">
                        <div>
                            <h3 class="font-bold text-lg">${b.dpb_branches_name}</h3>
                            <p class="text-xs text-gray-400">${b.dbp_location}</p>
                        </div>
                        <span class="text-orange-500">→</span>
                    </div>
                `).join('');
            },

            async selectBranch(name) {
                console.log(`📍 Memilih cabang: ${name}`);
                this.state.selectedBranch = name;
                document.getElementById('step-initial').classList.add('hidden');
                document.getElementById('step-staff').classList.remove('hidden');
                document.getElementById('staff-list').innerHTML = `<div class="h-40 skeleton rounded-3xl"></div>`;

                try {
                    const res = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_staff_list', branch_name: name })
                    });
                    const staffData = await res.json();
                    this.renderStaff(staffData);
                } catch (e) { console.error("❌ Gagal ambil staff:", e); }
            },

            renderStaff(staffs) {
                const container = document.getElementById('staff-list');
                container.innerHTML = staffs.map(s => `
                    <div class="bg-white border border-gray-100 rounded-[28px] p-6 shadow-sm mb-4">
                        <div class="flex items-center gap-4 mb-4">
                            <img src="${s.photo_url}" class="w-12 h-12 rounded-full object-cover">
                            <div>
                                <h4 class="font-bold text-lg">${s.dbp_staff_name}</h4>
                                <p class="text-[10px] text-gray-400 uppercase font-bold">${s.role}</p>
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${s.services.map(ser => `
                                <button onclick="APP_LOGIC.prep('${s.id}','${ser.id}',${ser.price})" 
                                        class="w-full flex justify-between p-3 rounded-xl border border-gray-50 active:bg-orange-50">
                                    <span class="text-sm">${ser.name}</span>
                                    <span class="text-sm font-bold">Rp ${ser.price.toLocaleString()}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            },

            prep(sid, pid, p) {
                document.getElementById('display-price').innerText = `Rp ${p.toLocaleString()}`;
                document.getElementById('bottom-bar').classList.remove('hidden');
            },

            resetToStep1() {
                document.getElementById('step-initial').classList.remove('hidden');
                document.getElementById('step-staff').classList.add('hidden');
            }
        };

        window.onload = () => APP_LOGIC.init();
    </script>
</body>
</html>
